[workspace]
resolver = "2"
members = [
    "crates/collector",
    "crates/features",
    "crates/scorer",
    "crates/token",
    "crates/wasm",
    "server/verify-api",
    "bench",
    "apps/browser/src-tauri",
]
# 브라우저 셸은 Windows(WebView2) 빌드 전용이므로 기본 빌드 대상에서 제외한다.
default-members = [
    "crates/collector",
    "crates/features",
    "crates/scorer",
    "crates/token",
    "crates/wasm",
    "server/verify-api",
    "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
guard-collector = { path = "crates/collector" }
guard-features = { path = "crates/features" }
guard-scorer = { path = "crates/scorer" }
guard-token = { path = "crates/token" }

base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

criterion = "0.5"

tauri = "2"
tauri-build = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
