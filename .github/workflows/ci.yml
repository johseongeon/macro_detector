name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Build WASM engine
        run: cargo build -p guard-wasm --target wasm32-unknown-unknown --release
      - name: Check WASM size budget (< 300 KB)
        run: |
          size=$(stat -c%s target/wasm32-unknown-unknown/release/guard_wasm.wasm)
          echo "guard_wasm.wasm: $size bytes"
          test "$size" -lt 307200
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bootstrap + WASM integration test
        run: node --test apps/browser/bootstrap/collector-bootstrap.test.mjs

  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown  # build.rs가 WASM 엔진을 빌드한다
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p guard-browser

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [ml, server/deep-analyzer]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
